version: '3'

networks:
  luby_projects:
    external: true

services:
  postgres:
    image: postgres
    container_name: 'postgres'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - .docker/db:/var/lib/postgresql/data
    networks:
      - d_d_adventure_sheet
